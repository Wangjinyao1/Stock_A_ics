name: Update Stock Calendar

on:
  # 每周一 08:00 (UTC) 自动更新（上交所公布新年度安排后自动补全年份）
  schedule:
    - cron: "0 8 * * 1"
  # 支持手动触发
  workflow_dispatch:
  # 主分支收到相关文件改动时也触发
  push:
    branches: [main]
    paths:
      - "sse_fetcher.py"
      - "trading_calendar.py"
      - "ics_generator.py"
      - "main.py"
      - "config.py"
      - "data/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate calendar
        env:
          # GitHub Actions 无法访问内网数据库，跳过持久化
          DB_ENABLED: "0"
          # 发布到自己的仓库后，把 GITHUB_REPO 改成 owner/repo
          GITHUB_REPO: ${{ github.repository }}
        run: python main.py --no-db

      - name: Commit updated ics files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar/*.ics
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update calendar $(date -u +%Y-%m-%d)"
            git push
          fi
